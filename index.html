<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Band Training</title>
<meta name="description" content="Browse stretch-band exercise videos, mark completed moves, and export your resistance-band training log.">
<meta name="application-name" content="Band Training">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0c0e0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Band Log">
<link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
:root{--bg:#0c0e0d;--panel:#151917;--panel2:#1c211e;--line:#2a302c;--ink:#f2f5f1;--mut:#8b938c;--mut2:#606861;--go:#c4ff1f;--warm:#ffd23f;--blue:#4cc4ff;--red:#ff6b5e;--purple:#b98bff;--green:#37d68a;font-size:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg)}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(110% 52% at 50% -10%,#1a241c 0%,rgba(26,36,28,0) 58%),var(--bg);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right)) 54px max(14px,env(safe-area-inset-left))}.kicker{font-size:.62rem;letter-spacing:.32em;color:var(--mut);font-weight:900;text-transform:uppercase}.title{font-size:2.1rem;line-height:1.05;font-weight:900;letter-spacing:-.04em;margin:4px 0 5px}.clock{font-size:.78rem;color:var(--go);font-weight:800;margin-bottom:4px;font-variant-numeric:tabular-nums}.sub{font-size:.78rem;color:var(--mut);line-height:1.45;margin:0 0 15px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.sumcard{min-height:64px;background:linear-gradient(180deg,#171c15,var(--panel));border:1px solid var(--line);border-radius:13px;padding:10px}.sumcard .sk{font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);font-weight:900;white-space:nowrap}.sumcard .sv{font-size:1.35rem;line-height:1;margin-top:7px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}.sumcard.hot{border-color:rgba(196,255,31,.55);box-shadow:0 12px 30px -26px rgba(196,255,31,.8)}.sumcard.hot .sv{color:var(--go)}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--ink);padding:12px 13px;font-size:.9rem;font-weight:700}.search::placeholder{color:var(--mut2)}.exp{font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#10140a;background:var(--go);border:none;border-radius:12px;padding:0 13px;cursor:pointer}.filters{display:flex;gap:7px;margin:0 0 12px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.fbtn{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:999px;font-size:.7rem;font-weight:900;padding:8px 11px;cursor:pointer}.fbtn.on{background:var(--go);border-color:var(--go);color:#10140a}.section{font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--mut2);font-weight:900;margin:14px 2px 9px}
.video-list{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:20px}.vcard{border:1px solid var(--line);background:var(--panel);border-radius:15px;overflow:hidden}.vtop{padding:12px 12px 10px;display:flex;gap:10px;align-items:flex-start}.tagdot{width:10px;height:10px;border-radius:999px;background:var(--go);margin-top:5px;flex:none}.vmeta{min-width:0;flex:1}.vtitle{font-size:1rem;font-weight:900;line-height:1.15}.vgrp{font-size:.69rem;color:var(--mut);font-weight:800;margin-top:4px}.vactions{display:flex;gap:8px;padding:0 12px 12px}.vactions button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:9px 8px;font-size:.74rem;font-weight:900;cursor:pointer}.vactions .done{background:var(--go);color:#10140a;border-color:var(--go)}.player{display:none;padding:0 12px 12px}.player.show{display:block}.player video{width:100%;max-height:340px;background:#000;border-radius:12px;border:1px solid var(--line)}.empty{color:var(--mut2);font-size:.84rem;text-align:center;padding:20px;border:1px dashed var(--line);border-radius:12px}.history-window{max-height:min(380px,38dvh);overflow-y:auto;padding-right:4px;-webkit-overflow-scrolling:touch;scrollbar-color:var(--line) transparent}.history-window::-webkit-scrollbar{width:6px}.history-window::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}.day{margin-bottom:14px}.dayhd{font-size:1rem;font-weight:900;color:var(--go);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:baseline}.dayhd .dc{font-size:.65rem;color:var(--mut2);font-weight:800}.ent{display:flex;align-items:center;gap:9px;padding:8px 4px;border-bottom:1px solid #1c211e}.ent .dot{width:9px;height:9px;border-radius:50%;flex:none}.ent .et{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--mut);font-weight:800;min-width:62px}.ent .en{font-size:.88rem;font-weight:700;flex:1}.ent .del{appearance:none;background:none;border:0;color:var(--mut2);font-size:.95rem;font-weight:900;cursor:pointer;padding:5px 8px;border-radius:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(22px);background:var(--go);color:#10140a;font-weight:900;font-size:.84rem;padding:11px 12px 11px 16px;border-radius:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 12px 32px -8px rgba(196,255,31,.5);display:flex;align-items:center;gap:12px}.toast.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}.toast button{background:#10140a;color:var(--go);border:none;border-radius:8px;font-weight:900;font-size:.74rem;padding:6px 11px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}.modal.show{display:flex}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:460px;width:100%}.card h3{margin:0 0 5px;font-size:1.35rem}.card p{margin:0 0 10px;font-size:.76rem;color:var(--mut);line-height:1.4}.card textarea{width:100%;height:190px;background:#0e120d;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:ui-monospace,monospace;font-size:.72rem;padding:10px;resize:vertical;user-select:all}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;border:none;border-radius:10px;padding:10px;font-weight:900;font-size:.8rem;cursor:pointer}.b-primary{background:var(--go);color:#10140a}.b-close{background:var(--panel2);color:var(--ink)}.b-fmt{background:none;border:1px solid var(--line)!important;color:var(--mut)}.b-fmt.on{color:var(--go);border-color:var(--go)!important}@media(max-width:370px){.summary{grid-template-columns:1fr}.tools{grid-template-columns:1fr}.exp{height:42px}}
</style>
</head>
<body>
<noscript><div class="wrap">Band Training needs JavaScript enabled.</div></noscript>
<div class="wrap">
  <div class="kicker">Stretch Band · Video Repository</div>
  <div class="title">Band training</div>
  <div class="clock" id="clock"></div>
  <p class="sub">Browse your local band-training videos, play the movement, and mark it done. The catalogue is read from <b>videos.json</b>; generate it from your repository using <b>tools/generate_video_index.py</b>.</p>
  <div class="summary" id="summary"></div>
  <div class="tools"><input class="search" id="search" placeholder="Search videos or body area…"><button class="exp" id="expBtn">Export</button></div>
  <div class="filters" id="filters"></div>
  <div class="section">Exercise videos</div>
  <div class="video-list" id="videos"></div>
  <div class="section">Completion log</div>
  <div class="history-window"><div id="history"></div></div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn">Undo</button></div>
<div class="modal" id="modal"><div class="card"><h3>Export band log</h3><p id="exportScope"></p><div class="row" style="margin:0 0 8px"><button class="b-fmt on" id="fmtCsv">CSV</button><button class="b-fmt" id="fmtJson">JSON</button></div><textarea id="expText" readonly></textarea><div class="row"><button class="b-primary" id="copyBtn">Copy</button><button class="b-close" id="downloadBtn">Download</button></div><div class="row"><button class="b-close" id="closeBtn">Close</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const VIDEO_BASE="https://ambijat.github.io/gym-band/videos/";
const DEFAULT_VIDEOS=[
 {title:"Adductors",group:"Adductors / Groin",file:VIDEO_BASE+"adductors.mp4"},
 {title:"Quadriceps",group:"Legs",file:VIDEO_BASE+"quadriceps.mp4"},
 {title:"Speed 1",group:"Speed / Agility",file:VIDEO_BASE+"speed1.mp4"},
 {title:"Stability",group:"Core / Stability",file:VIDEO_BASE+"stability.mp4"},
 {title:"Glutes Leg",group:"Legs",file:VIDEO_BASE+"glutes-leg.mp4"}
];
const COLORS=["#c4ff1f","#4cc4ff","#ff6b5e","#b98bff","#37d68a","#ffd23f","#2fe6c8"];
let videos=[],log=[],memFallback={},groupFilter="all",query="",lastId=null,expFmt="csv";
const KEY="bandtraining:entries";
async function sGet(k){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return k in memFallback?memFallback[k]:null}
async function sSet(k,v){memFallback[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function localDateKey(value=new Date()){const d=value instanceof Date?value:new Date(value);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function todayKey(){return localDateKey()} function makeId(){return crypto?.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function slug(v){return String(v).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")}
function groups(){return [...new Set(videos.map(v=>v.group||"General"))].sort()}
function colourFor(group){const gs=groups();return COLORS[Math.max(0,gs.indexOf(group))%COLORS.length]}
async function loadVideos(){try{const r=await fetch("./videos.json",{cache:"no-store"});if(r.ok){const data=await r.json();videos=(Array.isArray(data)?data:data.videos||[]).filter(v=>v&&v.title&&v.file);if(videos.length)return}}catch(e){}videos=DEFAULT_VIDEOS}
async function loadLog(){const raw=await sGet(KEY);if(!raw){log=[];return}try{const p=JSON.parse(raw);log=Array.isArray(p)?p.filter(e=>e&&e.title&&e.group&&e.ts):[]}catch(e){log=[];showToast("Saved log could not be read",false)}}
async function saveLog(){await sSet(KEY,JSON.stringify(log))}
function filteredVideos(){return videos.filter(v=>{const g=v.group||"General";const hay=(v.title+" "+g+" "+(v.notes||"")).toLowerCase();return (groupFilter==="all"||g===groupFilter)&&(!query||hay.includes(query.toLowerCase()))})}
function renderSummary(){const today=log.filter(e=>localDateKey(e.ts)===todayKey());const doneToday=new Set(today.map(e=>e.title));$("summary").innerHTML=[["Today",today.length,true],["Moves",videos.length,false],["Done",doneToday.size,false]].map(([k,v,hot])=>`<div class="sumcard ${hot?"hot":""}"><div class="sk">${esc(k)}</div><div class="sv">${esc(v)}</div></div>`).join("")}
function renderFilters(){const fs=[["all","All"]].concat(groups().map(g=>[g,g]));$("filters").innerHTML=fs.map(([key,label])=>`<button class="fbtn ${groupFilter===key?"on":""}" data-filter="${esc(key)}">${esc(label)}</button>`).join("");$("filters").querySelectorAll("[data-filter]").forEach(el=>el.onclick=()=>{groupFilter=el.dataset.filter;renderAll()})}
function renderVideos(){const list=filteredVideos();if(!list.length){$("videos").innerHTML='<div class="empty">No videos match this filter.</div>';return}$("videos").innerHTML=list.map((v,i)=>{const g=v.group||"General",c=colourFor(g),id=slug(v.title)+"-"+i;return `<div class="vcard"><div class="vtop"><span class="tagdot" style="background:${c}"></span><div class="vmeta"><div class="vtitle">${esc(v.title)}</div><div class="vgrp">${esc(g)}${v.notes?" · "+esc(v.notes):""}</div></div></div><div class="vactions"><button type="button" data-play="${esc(id)}">Play</button><button class="done" type="button" data-done="${esc(i)}">Mark done</button></div><div class="player" id="player-${esc(id)}"><video controls preload="metadata" src="${esc(v.file)}"></video></div></div>`}).join("");$("videos").querySelectorAll("[data-play]").forEach(el=>el.onclick=()=>$("player-"+el.dataset.play).classList.toggle("show"));$("videos").querySelectorAll("[data-done]").forEach(el=>el.onclick=()=>doLog(list[+el.dataset.done]));}
async function doLog(v){const entry={id:makeId(),title:v.title,group:v.group||"General",file:v.file,ts:new Date().toISOString()};log.push(entry);lastId=entry.id;await saveLog();renderAll();showToast("Completed: "+v.title,true)}
async function del(id){log=log.filter(e=>e.id!==id);await saveLog();renderAll()} async function undoLast(){if(lastId){await del(lastId);lastId=null;$("toast").classList.remove("show")}}
function showToast(message,canUndo){$("toastMsg").textContent=message;$("undoBtn").style.display=canUndo?"inline-block":"none";const t=$("toast");t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("show"),2600)}
function renderHistory(){if(!log.length){$("history").innerHTML='<div class="empty">No completed band exercises yet.</div>';return}const byDay={};log.forEach(e=>{const d=localDateKey(e.ts);(byDay[d]=byDay[d]||[]).push(e)});$("history").innerHTML=Object.keys(byDay).sort().reverse().map(d=>{const lbl=new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"});const items=byDay[d].slice().sort((a,b)=>b.ts.localeCompare(a.ts));return `<div class="day"><div class="dayhd">${esc(lbl)}<span class="dc">${items.length} done</span></div>${items.map(e=>{const tm=new Date(e.ts).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});return `<div class="ent"><span class="dot" style="background:${colourFor(e.group)}"></span><span class="et">${esc(tm)}</span><span class="en">${esc(e.title)}</span><button class="del" data-del="${esc(e.id)}">✕</button></div>`}).join("")}</div>`}).join("");$("history").querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>{if(confirm("Delete this log entry?"))del(el.dataset.del)})}
function renderAll(){renderSummary();renderFilters();renderVideos();renderHistory()}
function exportRows(){return log.slice().sort((a,b)=>a.ts.localeCompare(b.ts))}function csvCell(v){return `"${String(v??"").replace(/"/g,'""')}"`}
function buildExport(rows=exportRows()){if(expFmt==="json")return JSON.stringify(rows,null,2);let s="Date,Time,ISO,Exercise,Group,Video\n";rows.forEach(e=>{const d=new Date(e.ts);s+=[localDateKey(d),d.toLocaleTimeString(undefined,{hour12:false}),e.ts,e.title,e.group,e.file].map(csvCell).join(",")+"\n"});return s}
function updateExportPreview(){const rows=exportRows();$("exportScope").textContent=`Exporting ${rows.length} completed ${rows.length===1?"exercise":"exercises"}.`;$("expText").value=buildExport(rows)}
async function copyExport(){$("expText").select();try{await navigator.clipboard.writeText($("expText").value);showToast("Export copied",false)}catch(e){document.execCommand("copy");showToast("Export selected",false)}}
function downloadExport(){const ext=expFmt==="json"?"json":"csv";const blob=new Blob([buildExport()],{type:expFmt==="json"?"application/json":"text/csv"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`band-training-log-${todayKey()}.${ext}`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function tick(){const d=new Date();$("clock").textContent="Stamps as  "+d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+"  ·  "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}
(async function(){tick();setInterval(tick,1000);showToast("Welcome to Band Training",false);$("search").oninput=e=>{query=e.target.value.trim();renderVideos()};$("undoBtn").onclick=undoLast;$("expBtn").onclick=()=>{updateExportPreview();$("modal").classList.add("show")};$("closeBtn").onclick=()=>$("modal").classList.remove("show");$("copyBtn").onclick=copyExport;$("downloadBtn").onclick=downloadExport;$("fmtCsv").onclick=()=>{expFmt="csv";$("fmtCsv").classList.add("on");$("fmtJson").classList.remove("on");updateExportPreview()};$("fmtJson").onclick=()=>{expFmt="json";$("fmtJson").classList.add("on");$("fmtCsv").classList.remove("on");updateExportPreview()};await loadVideos();await loadLog();renderAll()})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(console.error))}
</script>
</body>
</html>
